[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theher"
version = "1.0.0"
description = "Kinetic fitting and analysis framework for the Hydrogen Evolution Reaction (HER)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "James Mario Silva", email = "jamesmario@usp.br" }
]
keywords = [
    "electrochemistry",
    "hydrogen-evolution-reaction",
    "volmer-heyrovsky-tafel",
    "kinetic-fitting",
    "tafel-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "lmfit>=1.2.0",
    "matplotlib>=3.8.0",
    "plotly>=5.16.0",
]

[project.optional-dependencies]
web = [
    "django>=4.2,<5.0",
    "dj-database-url>=1.0.0",
    "gunicorn>=21.2.0",
    "whitenoise>=6.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.6",
    "werkzeug>=3.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://theher.onrender.com/"
Repository = "https://github.com/jm96ps/TheHER"
Issues = "https://github.com/jm96ps/TheHER/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["theher*", "webapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
