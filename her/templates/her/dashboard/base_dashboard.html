{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TheHER Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=2">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- KaTeX for math and mhchem rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #064e3b;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-activity me-1"></i> TheHER</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbars" aria-controls="navbars" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbars">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <!-- Summary link removed per request -->
        <li class="nav-item"><a class="nav-link" href="/docs">Docs</a></li>
      </ul>
      <button class="btn btn-sm btn-outline-light rounded-pill" id="themeToggleBtn" title="Toggle Dracula Dark Mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
    </div>
  </div>
</nav>

<style>
  /* Dracula Theme Overrides */
  [data-bs-theme="dark"] {
    --bs-body-bg: #282a36;
    --bs-body-color: #f8f8f2;
    --bs-primary: #bd93f9;
    --bs-primary-rgb: 189, 147, 249;
    --bs-secondary: #6272a4;
    --bs-success: #50fa7b;
    --bs-info: #8be9fd;
    --bs-warning: #f1fa8c;
    --bs-danger: #ff5555;
    --bs-light: #f8f8f2;
    --bs-dark: #282a36;
    --bs-border-color: #44475a;
    --bs-border-color-translucent: rgba(68, 71, 90, 0.5);
    
    --bs-card-bg: #282a36;
    --bs-card-cap-bg: #44475a;
    --bs-card-border-color: #44475a;
    --bs-secondary-bg: #44475a;
    --bs-tertiary-bg: #44475a;
    --bs-heading-color: #f8f8f2;
    --bs-text-muted: #6272a4 !important;
    
    --bs-form-control-bg: #44475a;
    --bs-form-control-color: #f8f8f2;
    --bs-form-control-border-color: #6272a4;
    --bs-form-select-bg: #44475a;
    --bs-form-select-color: #f8f8f2;
    --bs-form-select-border-color: #6272a4;
    --bs-form-select-indicator-color: #f8f8f2;
    --bs-form-invalid-border-color: #ff5555;
    
    --bs-table-bg: #282a36;
    --bs-table-color: #f8f8f2;
    --bs-table-striped-bg: #44475a;
    
    /* Variables for index_organized.html custom styles */
    --primary-gradient: linear-gradient(135deg, #bd93f9 0%, #ff79c6 100%);
    --emerald-dark: #bd93f9;
    --emerald-primary: #ff79c6;
    --emerald-light: #ffb86c;
  }
  
  [data-bs-theme="dark"] body {
    background-color: #282a36 !important;
    color: #f8f8f2 !important;
  }
  [data-bs-theme="dark"] .app-card {
    background-color: #282a36 !important;
    border-color: #44475a !important;
  }
  [data-bs-theme="dark"] .bg-light,
  [data-bs-theme="dark"] .alert-light {
    background-color: #44475a !important;
    color: #f8f8f2 !important;
    border-color: #6272a4 !important;
  }
  [data-bs-theme="dark"] .text-dark,
  [data-bs-theme="dark"] .form-label,
  [data-bs-theme="dark"] .text-muted,
  [data-bs-theme="dark"] .small {
    color: #f8f8f2 !important;
  }
  [data-bs-theme="dark"] .accordion-button {
    background-color: #44475a;
    color: #f8f8f2;
  }
  [data-bs-theme="dark"] .accordion-button:not(.collapsed) {
    background-color: #6272a4;
    color: #f8f8f2;
  }
  [data-bs-theme="dark"] .btn-primary {
    background-color: #bd93f9;
    border-color: #bd93f9;
    color: #282a36;
  }
  [data-bs-theme="dark"] .btn-gradient {
    background: linear-gradient(135deg, #bd93f9 0%, #ff79c6 100%);
    border: none;
    color: #282a36;
  }
</style>
<div class="container-fluid">
  <!-- Author banner -->
  <div class="alert alert-light border-0 shadow-sm mt-3 mb-3" style="background: linear-gradient(135deg, #064e3b 0%, #0d9488 100%); color: white;">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h5 class="mb-1"><i class="bi bi-person-circle"></i> TheHER - Hydrogen Evolution Reaction Analysis</h5>
        <p class="mb-0 small">Developed by <strong>James Silva</strong>, PhD Candidate at IQSC-USP | <a href="mailto:jamesmario@usp.br" class="text-white text-decoration-underline">jamesmario@usp.br</a></p>
      </div>
      <div class="col-md-4 text-end">
        <a href="/docs" class="btn btn-light btn-sm me-2"><i class="bi bi-book"></i> Documentation</a>
        <a href="/about" class="btn btn-outline-light btn-sm"><i class="bi bi-info-circle"></i> About</a>
      </div>
    </div>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- KaTeX and auto-render with mhchem extension -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/mhchem.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  }
});
  // Dark Mode Toggle Logic
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const icon = themeToggleBtn.querySelector('i');
  
  // Apply saved theme on load
  const currentTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-bs-theme', currentTheme);
  updateIcon(currentTheme);

  themeToggleBtn.addEventListener('click', () => {
    let newTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateIcon(newTheme);
  });

  function updateIcon(theme) {
    if (theme === 'dark') {
      icon.classList.remove('bi-moon-stars-fill');
      icon.classList.add('bi-sun-fill');
      themeToggleBtn.classList.replace('btn-outline-light', 'btn-warning');
    } else {
      icon.classList.remove('bi-sun-fill');
      icon.classList.add('bi-moon-stars-fill');
      themeToggleBtn.classList.replace('btn-warning', 'btn-outline-light');
    }
  }
</script>
</body>
</html>
